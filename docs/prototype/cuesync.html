function memberForm(g,contactId){const c=contactId?contact(contactId):null;const m=c?g.members.find(x=>x.contactId===contactId):null;
  const avail=S.contacts.filter(x=>!g.members.some(y=>y.contactId===x.id));
  modal(`<h2>${c?'Edit member':'Add member'}</h2>
  ${!c&&avail.length?`<label class="f">Existing contact<select id="mf-existing"><option value="">New person</option>${avail.map(x=>`<option value="${x.id}">${esc(x.name)} (${esc(x.email||x.phone)})</option>`).join('')}</select></label>`:''}
  <div class="fields two" id="mf-new"><label class="f" style="grid-column:1/-1">Name<input id="mf-name" value="${esc(c?.name)}"></label>
   <label class="f">Email<input id="mf-email" type="email" value="${esc(c?.email)}" autocomplete="off"></label>
   <label class="f">Phone (optional)<input id="mf-phone" type="tel" value="${esc(c?.phone)}" autocomplete="off"></label>
   <label class="f">Preferred channel<select id="mf-channel"><option value="email" ${c?.channel!=='text'?'selected':''}>Email</option><option value="text" ${c?.channel==='text'?'selected':''}>Text</option></select></label></div>
  <label class="f">Role in ${esc(g.name)}<input id="mf-role" value="${esc(m?.role)}" placeholder="e.g. Alto, Bass, Keys"></label><span class="err" id="mf-err"></span>
  <div class="actions"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" id="mf-save">${c?'Save changes':'Add member'}</button></div>`);
  const ex=$('#mf-existing');if(ex)ex.oninput=()=>{$('#mf-new').style.display=ex.value?'none':''};
  $('#mf-save').onclick=()=>{const err=$('#mf-err');const role=$('#mf-role').value.trim();
    if(ex&&ex.value){g.members.push({contactId:ex.value,role});log('Added '+contact(ex.value).name+' to '+g.name);save();closeModal();toast('Member added');render();return}
    const d={name:$('#mf-name').value.trim(),email:$('#mf-email').value.trim(),phone:$('#mf-phone').value.trim(),channel:$('#mf-channel').value};
    if(!d.name){err.textContent='Add a name.';return}
    if(!d.email&&!d.phone){err.textContent='Add an email or a phone number so this person can be reached.';return}
    if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)){err.textContent='That email address looks incomplete.';return}
    if(d.channel==='text'&&!d.phone){err.textContent='Add a phone number, or set the preferred channel to email.';return}
    const clash=d.email&&S.contacts.find(x=>x.id!==c?.id&&x.email.toLowerCase()===d.email.toLowerCase());
    if(clash){err.textContent=clash.name+' already uses this email. Pick them from Existing contact instead.';return}
    if(c){Object.assign(c,d);m.role=role;log('Edited contact '+d.name)}else{const n={id:uid(),...d};S.contacts.push(n);g.members.push({contactId:n.id,role});log('Added '+d.name+' to '+g.name)}
    save();closeModal();toast(c?'Member updated':'Member added');render()}}

/* ---------- Composer ---------- */
let C=null;
function newC(evId){const c={step:1,eventId:'',groupIds:[],itemIds:[],channel:'email',tone:TONES[0],detail:'Standard',purpose:PURPOSES[0],extra:'',drafts:{},msgIds:{},active:'',busy:false,reviewed:false};if(evId)chooseEvent(c,evId);return c}
function chooseEvent(c,id){const e=ev(id);c.eventId=id;c.groupIds=[...e.groupIds];c.itemIds=e.setlist.map(i=>i.id);c.drafts={};c.msgIds={};c.step=2}
const STEPNAMES=['Event','Groups','Music','Customize','Generate','Review','Confirm'];
function vCompose(msgId){
  if(msgId){const m=S.messages.find(x=>x.id===msgId);if(!m)return notFound('That message was deleted.','#/messages');
    if(!C||C.msgIds[m.groupIds[0]]!==m.id){const e=ev(m.eventId);C=newC();Object.assign(C,{eventId:m.eventId,groupIds:[...m.groupIds],itemIds:e?e.setlist.map(i=>i.id):[],channel:m.channel,tone:m.tone||TONES[0],detail:m.detail||'Standard',purpose:m.purpose||PURPOSES[0],step:6,active:m.groupIds[0]});C.drafts[m.groupIds[0]]={subject:m.subject,body:m.body,source:m.source,warnings:[]};C.msgIds[m.groupIds[0]]=m.id}}
  if(!C)C=newC();
  const e=ev(C.eventId);if(C.step>1&&!e){C=newC()}
  const steps=`<ol class="steps" aria-label="Progress">${STEPNAMES.map((n,i)=>`<li class="${C.step===i+1?'on':C.step>i+1?'done':''}" ${C.step===i+1?'aria-current="step"':''}><b>${C.step>i+1?'✓':i+1}</b>${n}</li>`).join('')}</ol>`;
  return `<header class="pagehead"><div><h1>Prepare music &amp; send</h1>${e?`<p class="muted">${esc(e.title)}, ${fmtDate(e.date,e.time)}</p>`:''}</div><button class="btn ghost" data-act="compose-reset">Start over</button></header>${steps}${[s1,s2,s3,s4,s5,s6,s7][C.step-1]()}`}
const wiz=(back,next,nextLabel='Continue',disabled)=>`<div class="wizbar">${back?`<button class="btn lg" data-act="c-back">${ic('back')}Back</button>`:'<span></span>'}${next?`<button class="btn primary lg" data-act="c-next" ${disabled?'disabled':''}>${nextLabel}${ic('fwd')}</button>`:''}</div>`;
function s1(){const l=[...S.events].sort(byDate);return `<section class="stack"><h2>Which event is this for?</h2>${l.map(e=>`<button class="pick ${C.eventId===e.id?'on':''}" data-act="c-event" data-id="${e.id}" style="text-align:left;font:inherit;color:inherit"><div class="grow"><div class="t">${esc(e.title)}</div><div class="mini"><span>${fmtDate(e.date,e.time)}</span><span>${e.setlist.length} songs</span></div></div>${ic('fwd',18)}</button>`).join('')||empty('No events yet.','Create event','#/event/new')}
  ${l.length?`<a class="btn" href="#/event/new" style="justify-self:start">${ic('plus',18)}Create a new event</a>`:''}</section>`}
function s2(){return `<section class="stack"><h2>Who should get it?</h2><p class="muted small">Each group gets its own draft, written for that group.</p>
  ${S.groups.map(g=>{const ch=channels(g),on=C.groupIds.includes(g.id);return `<label class="pick ${on?'on':''}"><input type="checkbox" data-act="c-group" data-id="${g.id}" ${on?'checked':''}><div class="grow"><div class="t">${esc(g.name)}</div><div class="mini"><span>${g.members.length} members</span><span>${ch.email} with email</span><span>${ch.text} with phone</span></div></div></label>`}).join('')||empty('No groups yet.','New group','#/groups')}</section>${wiz(true,true,'Continue',!C.groupIds.length)}`}
function s3(){const e=ev(C.eventId);return `<section class="stack"><h2>Which songs go in the message?</h2>
  ${e.setlist.length?e.setlist.map((it,i)=>{const s=song(it.songId);if(!s)return'';const on=C.itemIds.includes(it.id);const n=Object.values(s.links).filter(Boolean).length;return `<label class="pick ${on?'on':''}"><input type="checkbox" data-act="c-item" data-id="${it.id}" ${on?'checked':''}><div class="cue-n" style="font-size:24px;width:30px">${i+1}</div><div class="grow"><div class="t">${esc(s.title)}</div><div class="mini"><span>${esc(s.artist)}</span><span>${n?n+' saved link'+(n>1?'s':''):'No saved links'}</span></div></div></label>`}).join(''):`<div class="empty"><p class="muted">This event has no songs yet.</p><a class="btn" href="#/event/${e.id}">Open setlist</a></div>`}
  <p class="small muted">Only links saved on each song are included. CueSync never adds links it has not stored.</p></section>${wiz(true,true)}`}
function s4(){const sel=(k,opts)=>`<select data-c="${k}">${opts.map(o=>`<option ${C[k]===o?'selected':''}>${o}</option>`).join('')}</select>`;
  return `<section class="card"><div class="fields two">
  <label class="f">Channel<select data-c="channel"><option value="email" ${C.channel==='email'?'selected':''}>Email</option><option value="text" ${C.channel==='text'?'selected':''}>Text message</option></select></label>
  <label class="f">Purpose${sel('purpose',PURPOSES)}</label><label class="f">Tone${sel('tone',TONES)}</label><label class="f">Level of detail${sel('detail',DETAILS)}</label>
  <label class="f" style="grid-column:1/-1">Anything else to include?<textarea data-c="extra" placeholder="e.g. Parking lot B is closed this week">${esc(C.extra)}</textarea></label></div></section>${wiz(true,true)}`}
function s5(){return `<section class="card stack" style="text-align:center;justify-items:center;padding:32px 18px">
  ${C.busy?`<div class="spinner" role="status" aria-label="Generating"></div><p>Writing ${C.groupIds.length} draft${C.groupIds.length>1?'s':''}…</p>`:`<h2>Ready to draft ${C.groupIds.length} message${C.groupIds.length>1?'s':''}</h2>
  <p class="muted">${AI?'Claude writes each draft from your event data only. Contact details are never sent to the AI.':'AI drafting is not available in this view, so CueSync will build each draft from a template.'}</p>
  <button class="btn primary lg" data-act="c-generate">${ic('spark')}Generate drafts</button>`}</section>${C.busy?'':wiz(true,false)}`}
function s6(){const g=grp(C.active)||grp(C.groupIds[0]);if(!g)return'';C.active=g.id;const d=C.drafts[g.id];
  const tabs=C.groupIds.length>1?`<nav class="tabs">${C.groupIds.map(id=>`<a href="#" data-act="c-tab" data-id="${id}" class="${id===g.id?'on':''}">${esc(grp(id)?.name||'Group')}</a>`).join('')}</nav>`:'';
  if(!d)return tabs+`<div class="empty"><p class="muted">No draft for this group yet.</p><button class="btn primary" data-act="c-regen">Generate draft</button></div>`+wiz(true,false);
  return `${tabs}<section class="card stack"><div class="row between wrap"><h2>${esc(g.name)}</h2><span class="pill ${d.source==='ai'?'accent':''}">${d.source==='ai'?'AI draft':'Template draft'}${d.edited?', edited':''}</span></div>
  ${(d.warnings||[]).map(w=>`<p class="note warn small">${esc(w)}</p>`).join('')}
  ${C.channel==='email'?`<label class="f">Subject<input data-cd="subject" value="${esc(d.subject)}"></label>`:''}
  <label class="f">Message<textarea class="body" data-cd="body">${esc(d.body)}</textarea></label>
  <div class="row wrap"><button class="btn" data-act="c-regen" ${C.busy?'disabled':''}>${ic('spark',18)}${C.busy?'Working…':'Regenerate'}</button><button class="btn" data-act="c-shorter" ${C.busy?'disabled':''}>Make shorter</button><button class="btn" data-act="c-save">Save draft</button></div></section>
  ${wiz(true,true,'Review recipients')}`}
function recipients(gid){const g=grp(gid);return g?g.members.map(m=>({...contact(m.contactId),role:m.role})).filter(x=>x.id):[]}
function s7(){const all=new Map();C.groupIds.forEach(gid=>recipients(gid).forEach(r=>{all.set(r.id,(all.get(r.id)||[]).concat(gid))}));
  const multi=[...all.entries()].filter(([,g])=>g.length>1).map(([id])=>contact(id).name);
  return `<section class="stack">
  <div class="note"><b>${all.size} ${all.size===1?'person':'people'}</b> across <b>${C.groupIds.length} group${C.groupIds.length>1?'s':''}</b> by <b>${C.channel==='email'?'email':'text message'}</b>.${multi.length?` ${esc(multi.join(', '))} ${multi.length>1?'are':'is'} in more than one group and will get one message per group.`:''}</div>
  ${C.groupIds.map(gid=>{const g=grp(gid),d=C.drafts[gid],r=recipients(gid);const reach=r.filter(x=>C.channel==='email'?x.email:x.phone),miss=r.filter(x=>!(C.channel==='email'?x.email:x.phone));const m=S.messages.find(x=>x.id===C.msgIds[gid]);
   return `<article class="card stack"><div class="row between wrap"><h2>${esc(g.name)}</h2>${m?statusPill(m.status):'<span class="pill">Not saved</span>'}</div>
   <div><h3 style="margin-bottom:6px">Recipients (${reach.length})</h3><div class="chips">${reach.map(x=>`<span class="pill">${esc(x.name)}: ${esc(C.channel==='email'?x.email:x.phone)}</span>`).join('')||'<span class="muted">No one in this group can be reached by this channel.</span>'}</div>
   ${miss.length?`<p class="err" style="margin-top:6px">Missing ${C.channel==='email'?'email':'phone'}: ${esc(miss.map(x=>x.name).join(', '))}</p>`:''}</div>
   ${d?`<div class="preview">${C.channel==='email'?`<b>Subject: ${esc(d.subject)}</b>\n\n`:''}${esc(d.body)}</div>
   <div class="row wrap"><button class="btn" data-act="c-copy" data-id="${gid}" ${C.reviewed?'':'disabled'}>${ic('copy',18)}Copy message</button>${C.channel==='email'?`<button class="btn" data-act="c-mailto" data-id="${gid}" ${C.reviewed&&reach.length?'':'disabled'}>${ic('mail',18)}Open in email app</button>`:''}<button class="btn" data-act="c-approval" data-id="${gid}">Mark awaiting approval</button></div>`:'<p class="err">No draft yet. Go back to generate one.</p>'}</article>`}).join('')}
  <section class="card stack"><label class="row" style="cursor:pointer"><input type="checkbox" data-act="c-reviewed" ${C.reviewed?'checked':''}><span>I reviewed the recipients and the final message.</span></label>
   <button class="btn primary lg" disabled title="No email provider is connected">${ic('send')}Send with connected provider</button>
   <p class="small muted">Sending directly needs an email provider connected on a server (Phase 4). Until then, copy the message or open it in your email app. CueSync records that you handed it off, not that it was delivered.</p></section></section>${wiz(true,false)}`}

function songsForMsg(){const e=ev(C.eventId);return e.setlist.filter(it=>C.itemIds.includes(it.id)).map(it=>{const s=song(it.songId);return s?{title:s.title,artist:s.artist,key:it.key||s.key||'',tempo:it.tempo||s.tempo||'',notes:it.notes||'',links:Object.entries(s.links).filter(([,u])=>u).map(([k,u])=>({kind:k==='video'?'Recording':k==='lyrics'?'Lyrics':'Chart',url:u}))}:null}).filter(Boolean)}
function groupGuidance(t){if(/choir|vocal/i.test(t))return'Please learn your parts with the reference recordings and bring your music marked.';if(/orchestra/i.test(t))return'Please review your parts and arrive early enough to set up and tune.';if(/band|worship|guest/i.test(t))return'Please review keys and transitions and have your charts ready before rehearsal.';return'Please review the songs below before we meet.'}
function templateDraft(g,short){const e=ev(C.eventId),songs=songsForMsg(),sign=S.settings.leader||'Your music director';const brief=short||C.detail==='Brief';
  const hi=C.tone==='Professional'?`Hello ${g.name},`:C.tone==='Brief and direct'?`${g.name},`:`Hi ${g.name} family,`;
  const L=[hi,'',`${C.purpose==='Last-minute change'?'Quick update for':'Here is the plan for'} ${e.title}: ${fmtDate(e.date,e.time)}${e.location?' at '+e.location:''}.`,''];
  if(songs.length){L.push('Setlist:');songs.forEach((s,i)=>{const meta=[s.key&&'Key '+s.key,s.tempo&&s.tempo+' BPM'].filter(Boolean).join(', ');L.push(`${i+1}. ${s.title}${meta?' ('+meta+')':''}`);if(!brief&&s.notes)L.push('   '+s.notes);if(!brief)s.links.forEach(l=>L.push(`   ${l.kind}: ${l.url}`))});L.push('')}
  if(!brief)L.push(groupGuidance(g.type));
  if(e.instructions)L.push(e.instructions);
  if(e.deadline)L.push(`Please be prepared by ${fmtDate(e.deadline)}.`);
  if(C.extra)L.push(C.extra);
  L.push('',C.tone==='Professional'?'Thank you,':'Thanks, see you there!',sign);
  return{subject:`${e.title}: ${C.purpose==='Last-minute change'?'update':'setlist and details'} (${fmtDate(e.date)})`,body:L.join('\n').replace(/\n{3,}/g,'\n\n'),source:'template',warnings:[]}}
function checkLinks(body){const allowed=new Set(songsForMsg().flatMap(s=>s.links.map(l=>l.url)));const found=body.match(/https?:\/\/[^\s)>\]]+/g)||[];return found.filter(u=>!allowed.has(u.replace(/[.,;]$/,'')))}
async function aiDraft(g,mode){const e=ev(C.eventId);
  const data={event:{title:e.title,type:e.type,date:fmtDate(e.date,e.time),location:e.location,prepareBy:e.deadline?fmtDate(e.deadline):'',instructions:e.instructions},group:{name:g.name,type:g.type,description:g.desc,preferences:g.prefs},songs:songsForMsg(),purpose:C.purpose,tone:C.tone,detail:mode==='shorter'?'Brief':C.detail,channel:C.channel,extraInstructions:C.extra,signOff:S.settings.leader||'Your music director'};
  const prev=mode==='shorter'&&C.drafts[g.id]?`\nShorten this existing draft while keeping every fact, song, and link it contains:\n${C.drafts[g.id].body}\n`:'';
  const prompt=`You write messages from a music leader to one music group.
Write one ${C.channel==='email'?'email':'text message (keep it under 600 characters)'} for the group in DATA.
Rules:
- Use only facts in DATA. Do not invent dates, times, keys, tempos, names, or links.
- List the songs in the given order, numbered. Include a link only if it appears in that song's links, copied exactly.
- Never include song lyrics.
- Tailor the preparation guidance to the group type and preferences.
- Match the requested tone, detail, and purpose. End with the signOff name.
Return only JSON, no code fences: {"subject": string, "body": string}. The body is plain text with line breaks.${prev}
DATA:
${JSON.stringify(data)}`;
  const r=await AI(prompt,{modelTier:'quick',cache:false});const t=r.text||'';const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
  if(typeof j.subject!=='string'||typeof j.body!=='string'||!j.body.trim())throw new Error('bad shape');
  const bad=checkLinks(j.body);
  return{subject:j.subject.trim(),body:j.body.trim(),source:'ai',warnings:bad.length?['The AI added links that are not saved on your songs. Remove them before sending: '+bad.join(', ')]:[]}}
async function draftFor(gid,mode){const g=grp(gid);if(AI){try{return await aiDraft(g,mode)}catch(err){if(err&&err.code==='not_granted')AI=null;toast('AI draft failed, so a template draft was used instead.',true)}}return templateDraft(g,mode==='shorter')}
async function generate(gids,mode){C.busy=true;render();for(const gid of gids){C.drafts[gid]=await draftFor(gid,mode)}C.busy=false;C.reviewed=false;if(C.step===5){C.step=6;C.active=gids[0]}render()}
function saveDrafts(status,only){C.groupIds.forEach(gid=>{if(only&&gid!==only)return;const d=C.drafts[gid];if(!d)return;let m=S.messages.find(x=>x.id===C.msgIds[gid]);
  if(!m){m={id:uid(),created:Date.now(),status:'draft'};S.messages.unshift(m);C.msgIds[gid]=m.id}
  Object.assign(m,{eventId:C.eventId,groupIds:[gid],channel:C.channel,subject:d.subject,body:d.body,source:d.source,tone:C.tone,detail:C.detail,purpose:C.purpose,updated:Date.now()});if(status)m.status=status});save()}

/* ---------- Message center ---------- */
const MTABS=[['drafts','Drafts',['draft']],['approval','Awaiting approval',['approval']],['handed','Handed off',['copied','handed']],['sent','Sent',['sent']],['failed','Failed',['failed']]];
function vMessages(tab){tab=MTABS.find(t=>t[0]===tab)?tab:'drafts';const [,label,sts]=MTABS.find(t=>t[0]===tab);const l=S.messages.filter(m=>sts.includes(m.status));
  const emptyText={drafts:'No drafts. Start one from an event.',approval:'Nothing is waiting for approval.',handed:'Messages you copy or open in your email app show up here. CueSync can’t confirm they were delivered.',sent:'Nothing is marked sent, because no email provider is connected. CueSync only marks a message sent when a provider confirms it.',failed:'Failed sends appear here once a provider is connected.'}[tab];
  return `<header class="pagehead"><h1>Message center</h1><button class="btn primary" data-act="compose-new">${ic('plus')}New message</button></header>
  <nav class="tabs">${MTABS.map(([k,n,s])=>`<a href="#/messages/${k}" class="${k===tab?'on':''}">${n}<span class="pill">${S.messages.filter(m=>s.includes(m.status)).length}</span></a>`).join('')}</nav>
  <section class="card"><div class="list">${l.length?l.map(m=>`<div class="item" style="flex-wrap:wrap"><a href="#/compose/${m.id}" class="grow" style="text-decoration:none;color:var(--ink);min-width:200px"><div class="t">${esc(m.subject||'Untitled')}</div><div class="mini"><span>${esc(ev(m.eventId)?.title||'Deleted event')}</span><span>${esc(m.groupIds.map(grp).filter(Boolean).map(g=>g.name).join(', '))}</span><span>${m.channel==='text'?'Text':'Email'}</span><span>Created ${new Date(m.created).toLocaleDateString()}</span></div></a>${statusPill(m.status)}<button class="btn icon ghost" data-act="msg-dup" data-id="${m.id}" aria-label="Duplicate">${ic('copy',18)}</button><button class="btn icon ghost" data-act="msg-del" data-id="${m.id}" aria-label="Delete">${ic('trash',18)}</button></div>`).join(''):`<p class="muted">${emptyText}</p>`}</div></section>`}

/* ---------- More / integrations / settings ---------- */
function vMore(){const L=[['research','Music research','search','Find songs to add to your library'],['messages','Message center','mail','Drafts, approvals, and history'],['compose','Prepare music & send','send','Build messages for your groups'],['integrations','Integrations','plug','What is connected and what is not'],['settings','Settings','gear','Workspace, your name, appearance']];
  return `<header class="pagehead"><h1>More</h1></header><section class="card"><div class="list">${L.map(([k,n,i,d])=>`<a class="item" href="#/${k}">${ic(i)}<div class="grow"><div class="t">${n}</div><div class="mini">${d}</div></div>${ic('fwd',18)}</a>`).join('')}</div></section>`}
function vIntegrations(){const R=(n,ok,st,d)=>`<div class="item" style="align-items:flex-start"><div class="grow"><div class="t">${n}</div><p class="muted small">${d}</p></div><span class="pill ${ok?'ok':''}">${st}</span></div>`;
  return `<header class="pagehead"><h1>Integrations</h1></header><section class="card"><div class="list">
  ${R('AI drafting',!!AI,AI?'Available':'Unavailable',AI?'Drafts are written by Claude from event data only. Contact details stay out of the prompt.':'Not available in this view. Drafts are built from templates.')}
  ${R('Email sending',false,'Not connected','Needs a server-side provider such as Resend, Postmark, Gmail, or Outlook with stored credentials. Planned for Phase 4.')}
  ${R('Music search',false,'Demo data','Real results need a search API (for example YouTube Data API) called from a server with its own key.')}
  ${R('Lyrics',false,'Links only','CueSync stores links to authorized lyrics pages. Displaying lyrics needs a licensed provider.')}
  ${R('Text messaging',false,'Not connected','Needs a provider such as Twilio, plus opt-in consent from each recipient.')}
  </div></section>`}
function vSettings(){return `<header class="pagehead"><h1>Settings</h1></header><section class="card"><div class="fields two">
  <label class="f">Workspace name<input id="st-ws" value="${esc(S.settings.workspace)}"></label>
  <label class="f">Your name (used to sign messages)<input id="st-leader" value="${esc(S.settings.leader)}" placeholder="e.g. Andrew Thomas"></label>
  <label class="f">Appearance<select id="st-theme"><option value="system" ${S.settings.theme==='system'?'selected':''}>Match device</option><option value="light" ${S.settings.theme==='light'?'selected':''}>Light</option><option value="dark" ${S.settings.theme==='dark'?'selected':''}>Dark</option></select></label></div>
  <div class="row" style="margin-top:16px"><button class="btn primary" data-act="st-save">Save settings</button></div></section>
  <section class="card" style="margin-top:16px"><h2 style="margin-bottom:6px">Reset prototype</h2><p class="muted small" style="margin-bottom:12px">Erase everything in this browser and reload the demo workspace.</p><button class="btn danger" data-act="st-reset">Reset demo data</button></section>`}
function notFound(msg,back){return `<div class="empty" style="margin-top:40px"><p>${msg}</p><a class="btn" href="${back}">Go back</a></div>`}

/* ---------- Actions ---------- */
const A={
 'close-modal':closeModal,
 collapse(){S.settings.collapsed=!S.settings.collapsed;save();navRender(parse()[0])},
 fab(){modal(`<h2>What do you want to do?</h2><div class="stack"><a class="btn primary lg" href="#/event/new" data-act="close-modal">${ic('plus')}Create event</a><button class="btn lg" data-act="compose-new">${ic('send')}Prepare music &amp; send</button><button class="btn lg" data-act="song-new">${ic('music')}Add song</button></div>`)},
 'compose-new'(){closeModal();C=newC();go('#/compose')},
 'compose-reset'(){confirmModal('Start over?','Unsaved drafts in this composer will be cleared. Saved drafts stay in the message center.','Start over',()=>{C=newC();go('#/compose')},false)},
 'ew-group'(id){const i=EW.groupIds.indexOf(id);i<0?EW.groupIds.push(id):EW.groupIds.splice(i,1);markDirty();render()},
 'ew-add'(id){EW.setlist.push({id:uid(),songId:id,key:'',tempo:'',notes:''});markDirty();render();toast('Added '+song(id).title);$('#songq')?.focus()},
 'ew-up'(i){i=+i;if(i>0){[EW.setlist[i-1],EW.setlist[i]]=[EW.setlist[i],EW.setlist[i-1]];markDirty();render();document.querySelector(`[data-act="ew-up"][data-id="${i-1}"]`)?.focus()}},
 'ew-down'(i){i=+i;if(i<EW.setlist.length-1){[EW.setlist[i+1],EW.setlist[i]]=[EW.setlist[i],EW.setlist[i+1]];markDirty();render();document.querySelector(`[data-act="ew-down"][data-id="${i+1}"]`)?.focus()}},
 'ew-rm'(i){const s=song(EW.setlist[+i].songId);confirmModal('Remove from setlist?',`“${esc(s?.title)}” will be removed from this event. It stays in your library.`,'Remove',()=>{EW.setlist.splice(+i,1);markDirty();render()})},
 'ew-save'(){let ok=true;$('#err-title').textContent='';$('#err-date').textContent='';
  if(!EW.title.trim()){$('#err-title').textContent='Add a title for this event.';ok=false}
  if(!EW.date){$('#err-date').textContent='Pick a date.';ok=false}
  if(EW.deadline&&EW.date&&EW.deadline>EW.date){toast('The rehearsal deadline is after the event date.',true);ok=false}
  if(!ok){toast('Fix the highlighted fields to save.',true);return}
  const {isNew,dirty,...data}=EW;data.title=data.title.trim();data.updated=Date.now();
  if(isNew){data.created=Date.now();S.events.push(data);log('Created event '+data.title)}else{const i=S.events.findIndex(x=>x.id===data.id);S.events[i]={...S.events[i],...data};log('Edited event '+data.title)}
  save();EW=null;toast('Event saved');go('#/event/'+data.id)},
 'ew-revert'(){confirmModal('Discard changes?','Your edits to this event since the last save will be lost.','Discard',()=>{EW=null;render()})},
 'ew-delete'(){confirmModal('Delete this event?',`“${esc(EW.title)}” and its setlist will be deleted. Songs stay in your library. Messages about it stay in the message center.`,'Delete event',()=>{S.events=S.events.filter(x=>x.id!==EW.id);log('Deleted event '+EW.title);EW=null;save();toast('Event deleted');go('#/events')})},
 'ew-compose'(){if(EW.dirty){toast('Save the event first so the message uses your latest changes.',true);return}C=newC(EW.id);go('#/compose')},
 async 'song-new'(id,el,e){e?.preventDefault();const q=$('#songq')?.value;await songForm(q?{title:q,artist:'',version:'',key:'',tempo:'',tags:[],links:{video:'',lyrics:'',chart:''},rights:'',notes:''}:null);render()},
 async 'song-edit'(id){await songForm(clone(song(id)));render()},
 'song-to-event'(id){pickEvent(id)},
 'song-del'(id){const s=song(id);const n=S.events.filter(e=>e.setlist.some(i=>i.songId===id)).length;confirmModal('Delete this song?',`“${esc(s.title)}” will be removed from your library${n?` and from ${n} event setlist${n>1?'s':''}`:''}.`,'Delete song',()=>{S.songs=S.songs.filter(x=>x.id!==id);S.events.forEach(e=>e.setlist=e.setlist.filter(i=>i.songId!==id));if(EW)EW.setlist=EW.setlist.filter(i=>i.songId!==id);log('Deleted song '+s.title);save();toast('Song deleted');go('#/music')})},
 'res-go':runResearch,
 async 'res-save'(i){const x=RES.results[+i];const rec=await songForm({title:x.title,artist:x.artist,version:'',key:'',tempo:'',tags:x.tags.split(' ').slice(0,2),links:{video:'',lyrics:'',chart:''},rights:'',notes:''},true);if(rec)confirmModal('Add it to an event too?',`“${esc(rec.title)}” is in your library.`,'Choose event',()=>pickEvent(rec.id),false)},
 'group-new'(){groupForm()},
 'group-edit'(id){groupForm(clone(grp(id)))},
 'group-del'(id){const g=grp(id);confirmModal('Delete this group?',`“${esc(g.name)}” will be removed from all events. People in it stay in your contacts and other groups.`,'Delete group',()=>{S.groups=S.groups.filter(x=>x.id!==id);S.events.forEach(e=>e.groupIds=e.groupIds.filter(x=>x!==id));log('Deleted group '+g.name);save();toast('Group deleted');go('#/groups')})},
 'mem-add'(){memberForm(grp(GID))},
 'mem-edit'(id){memberForm(grp(GID),id)},
 'mem-rm'(id){const g=grp(GID),c=contact(id);confirmModal('Remove from group?',`${esc(c.name)} will be removed from ${esc(g.name)}. Their contact stays saved.`,'Remove',()=>{g.members=g.members.filter(m=>m.contactId!==id);log('Removed '+c.name+' from '+g.name);save();toast('Member removed');render()})},
 'c-event'(id){chooseEvent(C,id);render()},
 'c-group'(id,el){const i=C.groupIds.indexOf(id);el.checked?(i<0&&C.groupIds.push(id)):(i>=0&&C.groupIds.splice(i,1));render()},
 'c-item'(id,el){const i=C.itemIds.indexOf(id);el.checked?(i<0&&C.itemIds.push(id)):(i>=0&&C.itemIds.splice(i,1));render()},
 'c-back'(){C.step=C.step===6&&!C.busy?4:Math.max(1,C.step-1);render()},
 'c-next'(){if(C.step===2&&!C.groupIds.length)return;if(C.step===6){saveDrafts();toast('Drafts saved')}C.step++;render()},
 'c-generate'(){generate([...C.groupIds])},
 'c-regen'(){generate([C.active])},
 'c-shorter'(){generate([C.active],'shorter')},
 'c-tab'(id,el,e){e.preventDefault();C.active=id;render()},
 'c-save'(){saveDrafts();toast('Draft saved to message center');render()},
 'c-reviewed'(id,el){C.reviewed=el.checked;render()},
 async 'c-copy'(gid){const d=C.drafts[gid];const ok=await copyText((C.channel==='email'?'Subject: '+d.subject+'\n\n':'')+d.body);if(!ok){toast('Copy was blocked. Select the text in the preview and copy it manually.',true);return}
  saveDrafts(null,gid);const m=S.messages.find(x=>x.id===C.msgIds[gid]);if(m.status==='draft'||m.status==='approval')m.status='copied';log('Copied message for '+grp(gid).name);save();toast('Copied. Paste it into your email or messaging app.');render()},
 'c-mailto'(gid){const d=C.drafts[gid];const to=recipients(gid).map(r=>r.email).filter(Boolean);const url=`mailto:?bcc=${to.map(encodeURIComponent).join(',')}&subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.body)}`;
  confirmModal('Open in your email app?',`A new email to ${to.length} recipient${to.length>1?'s':''} (in BCC) will open in your email app. You still press send there.${url.length>1900?' This message is long, and some email apps cut long messages short. Copy may work better.':''}`,'Open email app',()=>{saveDrafts('handed',gid);log('Handed message for '+grp(gid).name+' to email app');save();window.open(url,'_blank');render()},false)},
 'c-approval'(gid){saveDrafts('approval',gid);log('Marked message for '+grp(gid).name+' awaiting approval');save();toast('Marked awaiting approval');render()},
 'msg-dup'(id){const m=S.messages.find(x=>x.id===id);const n={...clone(m),id:uid(),status:'draft',subject:'Copy of '+m.subject,created:Date.now(),updated:Date.now()};S.messages.unshift(n);save();toast('Duplicated as a draft');render()},
 'msg-del'(id){const m=S.messages.find(x=>x.id===id);confirmModal('Delete this message?',`“${esc(m.subject)}” will be deleted from the message center.`,'Delete',()=>{S.messages=S.messages.filter(x=>x.id!==id);if(C)for(const k in C.msgIds)if(C.msgIds[k]===id)delete C.msgIds[k];save();toast('Message deleted');render()})},
 'st-save'(){const ws=$('#st-ws').value.trim();if(!ws){toast('Workspace name can’t be empty.',true);return}S.settings.workspace=ws;S.settings.leader=$('#st-leader').value.trim();S.settings.theme=$('#st-theme').value;save();toast('Settings saved');render()},
 'st-reset'(){confirmModal('Reset all data?','Every event, song, group, and message in this browser will be erased and replaced with the demo workspace.','Reset',()=>{S=seed();save();EW=null;C=null;RES={q:'',results:null};toast('Demo data restored');go('#/home')})}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const f=A[a.dataset.act];if(!f)return;if(a.tagName==='A'&&a.dataset.act!=='close-modal')e.preventDefault();f(a.dataset.id,a,e)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.ew&&EW){EW[t.dataset.ew]=t.value;markDirty();if(t.tagName==='SELECT')render()}
 else if(t.dataset.sl&&EW){const [i,f]=t.dataset.sl.split(':');EW.setlist[+i][f]=t.value;markDirty()}
 else if(t.dataset.c&&C){C[t.dataset.c]=t.value}
 else if(t.dataset.cd&&C){const d=C.drafts[C.active];d[t.dataset.cd]=t.value;d.edited=true;if(t.dataset.cd==='body')d.warnings=checkLinks(t.value).length?d.warnings:[]}
 else if(t.id==='songq')renderSongPick();
 else if(t.id==='libq'||t.id==='libtag'){LIB[t.id==='libq'?'q':'tag']=t.value;$('#liblist').innerHTML=libHTML()}
 else if(t.id==='evq'||t.id==='evtype'){EVF[t.id==='evq'?'q':'type']=t.value;$('#evlist').innerHTML=evListHTML()}
 else if(t.id==='memq'){MEMQ=t.value;$('#memlist').innerHTML=memHTML(grp(GID))}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='resq'){e.preventDefault();runResearch()}});
window.addEventListener('beforeunload',e=>{if(EW&&EW.dirty){e.preventDefault();e.returnValue=''}});
render();
</script>
